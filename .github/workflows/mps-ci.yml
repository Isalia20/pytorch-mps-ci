name: MPS CI

on:
  repository_dispatch:
    types: [pull_request, push]

run-name: >-
  ${{
    github.event.client_payload.event_type == 'pull_request' &&
    format('PR #{0} ({1})',
      github.event.client_payload.payload.pull_request.number,
      github.event.client_payload.payload.action) ||
    format('Push {0}', github.event.client_payload.payload.ref)
  }}

concurrency:
  group: >-
    mps-ci-${{ github.event.client_payload.payload.repository.full_name }}-${{
    github.event.client_payload.payload.pull_request.number ||
    github.event.client_payload.payload.ref || github.run_id }}
  # A new commit on a ciflow/mps PR (or a duplicate dispatch) supersedes the
  # run in flight; main and nightly runs are never cancelled.
  cancel-in-progress: ${{ startsWith(github.event.client_payload.payload.ref, 'refs/tags/ciflow/mps/') }}

permissions:
  contents: read
  id-token: write

jobs:
  mps-test:
    if: >-
      ${{ github.event.client_payload.event_type == 'push' &&
      (github.event.client_payload.payload.ref == 'refs/heads/main' ||
      github.event.client_payload.payload.ref == 'refs/heads/nightly' ||
      startsWith(github.event.client_payload.payload.ref, 'refs/tags/ciflow/mps/')) &&
      github.event.client_payload.payload.deleted != true }}
    runs-on: [self-hosted, mps]
    timeout-minutes: 360
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      # Nightly runs self-report a single completed callback; main and
      # ciflow/mps pushes use the regular dispatched flow, which needs
      # in_progress first.
      - name: Report in progress
        if: github.event.client_payload.payload.ref != 'refs/heads/nightly'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: in_progress

      - name: Checkout PyTorch at dispatched commit
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: ${{ github.event.client_payload.payload.after }}
          path: pytorch

      # The runner's network drops some connections when many open at once,
      # so fetch submodules with limited parallelism and retry on failure.
      - name: Fetch PyTorch submodules
        working-directory: pytorch
        run: |
          for attempt in 1 2 3; do
            git submodule sync --recursive
            if git submodule update --init --recursive --jobs 4; then
              # An interrupted clone can leave a submodule at the right commit
              # with no files, which update then skips; restore any such tree.
              git submodule foreach --recursive --quiet 'git reset --hard -q'
              exit 0
            fi
            echo "Submodule fetch attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          exit 1

      - name: Set up Python environment
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          VENV="$HOME/.mps-ci/venv"
          [ -d "$VENV" ] || python3.13 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Build PyTorch
        working-directory: pytorch
        run: |
          pip install -r .ci/docker/requirements-ci.txt
          pip install -r requirements.txt
          set -o pipefail
          mkdir -p test/test-reports
          pip install -e . -v --no-build-isolation 2>&1 | tee test/test-reports/build.log | tail -20
          ccache -s
          TORCH_DIR=$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'torch'))")
          mkdir -p "$TORCH_DIR/include/c10/metal"
          cp c10/metal/*.h "$TORCH_DIR/include/c10/metal/"
          cp /Users/Shared/mps-ci/include/omp.h "$TORCH_DIR/include/"
          cp /Users/Shared/mps-ci/lib/libomp.dylib "$TORCH_DIR/lib/"
          install_name_tool -id /Users/Shared/mps-ci/lib/libomp.dylib "$TORCH_DIR/lib/libomp.dylib"
          codesign -f -s - "$TORCH_DIR/lib/libomp.dylib"

      - name: MPS smoke test
        run: |
          python -c "
          import torch
          assert torch.backends.mps.is_available()
          x = torch.ones(128, 128, device='mps')
          assert (x @ x).sum().item() == 128 * 128 * 128
          print(torch.__version__, torch.version.git_version)
          "

      - name: Run MPS tests
        working-directory: pytorch
        env:
          GLOO_SOCKET_IFNAME: lo0
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/inductor-cache
          LIBRARY_PATH: /Users/Shared/mps-ci/lib
        run: |
          ulimit -n 16384
          python -c "from torch._inductor.runtime.cache_dir_utils import default_cache_dir; import shutil; shutil.rmtree(default_cache_dir(), ignore_errors=True)"
          time PYTORCH_TEST_WITH_SLOW=1 python test/run_test.py --verbose --mps
          MTL_DEBUG_LAYER=1 MTL_SHADER_VALIDATION=1 python test/test_mps.py --verbose -k test_add_sub
          for _ in 1 2 3; do
            MTL_CAPTURE_ENABLED=1 python test/test_mps.py --verbose -k test_metal_capture && break
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: pytorch/test/test-reports
          if-no-files-found: ignore

      - name: Report result
        if: always()
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ job.status }}
          event-type: ${{ github.event.client_payload.payload.ref == 'refs/heads/nightly' && 'nightly' || '' }}
          delivery-id: ${{ github.event.client_payload.payload.ref == 'refs/heads/nightly' && github.event.client_payload.payload.after || '' }}
          artifact-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Log dispatch payload
        if: always()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ```json
          ${{ toJson(github.event.client_payload) }}
          ```
          EOF
