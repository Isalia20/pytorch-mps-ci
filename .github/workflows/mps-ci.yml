name: MPS CI

on:
  repository_dispatch:
    types: [pull_request, push]

run-name: >-
  ${{
    github.event.client_payload.event_type == 'pull_request' &&
    format('PR #{0} ({1})',
      github.event.client_payload.payload.pull_request.number,
      github.event.client_payload.payload.action) ||
    format('Push {0}', github.event.client_payload.payload.ref)
  }}

concurrency:
  group: >-
    mps-ci-${{ github.event.client_payload.payload.repository.full_name }}-${{
    github.event.client_payload.payload.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cancel-workflow:
    if: ${{ github.event.client_payload.payload.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR closed, superseded runs canceled via the concurrency group"

  mps-test:
    if: >-
      ${{ github.event.client_payload.payload.action != 'closed' &&
      github.event.client_payload.payload.deleted != true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PyTorch at dispatched commit
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: >-
            ${{ github.event.client_payload.event_type == 'pull_request' &&
            github.event.client_payload.payload.pull_request.head.sha ||
            github.event.client_payload.payload.after }}
          path: pytorch

      - name: Run MPS tests
        run: echo "PyTorch SHA: $(git -C pytorch rev-parse HEAD)"

      - name: Log dispatch payload
        if: always()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ```json
          ${{ toJson(github.event.client_payload) }}
          ```
          EOF
